name: alert-agent
on:
  schedule: [{ cron: "7,37 * * * *" }]   # evita el minuto 0 (hora pico)
  workflow_dispatch:
permissions: { contents: write }
jobs:
  run:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - run: pip install -r requirements.txt && python agent.py
        env:
          TG_TOKEN: ${{ secrets.TG_TOKEN }}
          TG_CHAT: ${{ secrets.TG_CHAT }}
          GROQ_KEY: ${{ secrets.GROQ_KEY }}
      - run: |
          git config user.name bot && git config user.email bot@users.noreply.github.com
          git add state.json && git commit -m "state" || true
          git push
